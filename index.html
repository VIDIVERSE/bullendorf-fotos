*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:16px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;text-align:center}
h1{margin:4px 0 6px;text-align:center;font:900 34px/1.08 WelcomeSlab,"Rockwell Extra Bold",Rockwell,Georgia,serif;text-shadow:.07em .07em .05em rgba(0,0,0,.85)}
.ev{font:900 20px/1.2 WelcomeSlab,Georgia,serif;text-shadow:.07em .07em .05em rgba(0,0,0,.85);min-height:1.4em;text-align:center}

<!--PK-BG--><canvas id="pkBg"></canvas><script>
(function(){ /* Plakat-Hintergrund wie der Willkommens-Bildschirm auf der LED-Wand */
  var c=document.getElementById('pkBg'); if(!c) return; var o=c.getContext('2d'), W=0, H=0, crowd=null, dpr=Math.min(2,window.devicePixelRatio||1), still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.body.classList.add('pk');
  function size(){ W=c.clientWidth; H=c.clientHeight; c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); o.setTransform(dpr,0,0,dpr,0,0); crowd=null; }
  function makeCrowd(){ var seed=11, rnd=function(){ return (seed=(seed*16807)%2147483647)/2147483647; }, unit=Math.min(H,W*0.7)*0.085, n=Math.max(8,Math.round(W/(unit*1.25))), p=[];
    for (var i=0;i<n;i++) p.push({x:(i+0.2+rnd()*0.6)/n*W,s:0.8+rnd()*0.45,arm:rnd(),ph:rnd()*6.283,lean:(rnd()-0.5)*0.5,unit:unit}); return p; }
  function draw(t){
    var g=o.createLinearGradient(0,0,W,H*0.7); g.addColorStop(0,'#1534d6'); g.addColorStop(.32,'#58a6ff'); g.addColorStop(.52,'#c8b4ff'); g.addColorStop(.75,'#e050de'); g.addColorStop(1,'#a81bbd');
    o.fillStyle=g; o.fillRect(0,0,W,H);
    var R=Math.max(W,H)*0.55, rg=o.createRadialGradient(W*0.3,H*0.5,0,W*0.3,H*0.5,R); rg.addColorStop(0,'rgba(255,255,255,0.55)'); rg.addColorStop(1,'rgba(255,255,255,0)'); o.fillStyle=rg; o.fillRect(0,0,W,H);
    var gs=Math.max(10,Math.min(W,H)/11);
    for (var y=gs/2;y<H+gs;y+=gs){ var fy=y/H;
      for (var x=gs/2;x<W+gs;x+=gs){ var wave=0.5+0.5*Math.sin(x/W*5-t*1.1+fy*4), r=gs*0.5*(Math.abs(fy-0.48)*1.2+wave*0.35); if (r<0.5) continue; r=Math.min(r,gs*0.47);
        var k=x/W; o.fillStyle='rgba('+(20+k*190|0)+','+(60-k*35|0)+','+(235-k*25|0)+','+(0.5-0.15*Math.abs(fy-0.5)).toFixed(2)+')'; o.beginPath(); o.arc(x,y,r,0,6.2832); o.fill(); } }
    if (!crowd) crowd=makeCrowd(); var pulse=0.5+0.5*Math.sin(t*4.2);
    o.fillStyle='#000'; o.strokeStyle='#000'; o.lineCap='round'; o.lineJoin='round';
    for (var i=0;i<crowd.length;i++){ var p=crowd[i], s=p.s*p.unit, jump=pulse*s*0.14*(0.4+0.6*(0.5+0.5*Math.sin(p.ph))), by=H+s*0.25-jump;
      o.beginPath(); o.ellipse(p.x,by-s*0.55,s*0.62,s*0.85,0,0,6.2832); o.fill();
      o.beginPath(); o.arc(p.x+p.lean*s*0.2,by-s*1.6,s*0.34,0,6.2832); o.fill();
      var arms=p.arm>0.75?[1,-1]:p.arm>0.4?[p.arm>0.57?1:-1]:[];
      for (var j=0;j<arms.length;j++){ var sg=arms[j], sx=p.x+sg*s*0.45, sy=by-s*1.15, ang=-1.5708+sg*(0.35+p.lean*0.3)-sg*pulse*0.18+Math.sin(t*2.2+p.ph)*0.07, L=s*1.35,
        ex=sx+Math.cos(ang)*L*0.5, ey=sy+Math.sin(ang)*L*0.5, a2=ang-sg*0.2, hx=ex+Math.cos(a2)*L*0.5, hy=ey+Math.sin(a2)*L*0.5;
        o.lineWidth=s*0.22; o.beginPath(); o.moveTo(sx,sy); o.lineTo(ex,ey); o.lineTo(hx,hy); o.stroke(); o.beginPath(); o.arc(hx,hy,s*0.15,0,6.2832); o.fill(); } }
  }
  var last=0; function loop(ts){ if (c.style.display!=='none' && !document.hidden && ts-last>66){ last=ts; draw(ts/1000); } if (!still) requestAnimationFrame(loop); }
  size(); window.addEventListener('resize',size); draw(0); if (!still) requestAnimationFrame(loop);
})();

<h1>Dein Foto auf<br>die LED-Wand!</h1>
<div class="ev" id="ev"></div>
<div class="card">
  <div class="spin" id="spin"></div>
  <div id="msg">Verbinde mit der Fotowand …</div>
  <button id="again">Nochmal versuchen</button>
</div>
<script>
const REPO='VIDIVERSE/bullendorf-fotos';
const $=id=>document.getElementById(id);
let tries=0, timer=null;
function show(t,spin,btn){ $('msg').textContent=t; $('spin').style.display=spin?'block':'none'; $('again').style.display=btn?'block':'none'; }
async function getJson(url,ms){ const c=new AbortController(), t=setTimeout(()=>c.abort(),ms); try{ const r=await fetch(url,{cache:'no-store',signal:c.signal}); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } finally{ clearTimeout(t); } }
async function target(){
  const a=getJson('target.json?t='+Date.now(),6000);
  const b=getJson('https://api.github.com/repos/'+REPO+'/contents/target.json?t='+Date.now(),6000).then(j=>{ try{ return j&&j.content?JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,''))))):null; }catch(e){ return null; } });
  const L=(await Promise.all([a,b])).filter(Boolean).sort((x,y)=>(y.ts||0)-(x.ts||0));
  return L[0]||null;
}
async function go(){
  clearTimeout(timer); tries++; show('Verbinde mit der Fotowand …',true,false);
  const t=await target();
  if (t && t.event){ $('ev').textContent=t.event; document.title='Fotowand · '+t.event; }
  if (!t || !t.on || !t.url || !t.code){ show('Die Fotowand ist gerade nicht aktiv. Sobald sie startet, geht es hier automatisch weiter.',false,true); timer=setTimeout(go,15000); return; }
  const dest=t.url.replace(/\/+$/,'')+'/g/'+encodeURIComponent(t.code)+'/';
  const ping=await getJson(dest+'info',8000);
  if (ping && ping.ok){ show('Gleich geht’s los …',true,false); location.replace(dest); return; }
  if (tries<4){ timer=setTimeout(go,4000); return; }
  show('Die Fotowand ist gerade nicht erreichbar. Wir versuchen es weiter …',false,true); timer=setTimeout(go,15000);
}
$('again').onclick=()=>{ tries=0; go(); };
go();
</script>
</body>
</html>
